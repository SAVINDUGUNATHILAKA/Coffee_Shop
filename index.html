<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Coffee Shop Website</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>
    <!-- Navbar Header -->
    <header>
        <!-- Logo -->
        <a href="#" class="logo">
            <img src="img/logo.jpeg" alt="Coffee Shop Logo">
        </a>

        <!-- Menu Icon -->
        <!-- <i class="bx bx-menu" id="menu-icon"></i> -->
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"
            id="menu-icon">
            <path d="M 3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z"></path>
        </svg>

        <!-- Links -->
        <ul class="navbar">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About Us</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#customer">Customer</a></li>
        </ul>


        <!-- Icons -->
        <div class="header-icon">

            <!-- Cart Icon -->
            <i class="bx bx-cart-alt" id="cart-icon"></i>

            <!-- Search Icon -->
            <i class="bx bx-search" id="search-icon"></i>
        </div>

        <!-- Search Box -->
        <div class="search-box">
            <input type="search" id="search-input" placeholder="Search...">
            <i class="bx bx-search"></i>
        </div>
    </header>

    <!-- Home -->
    <section class="home" id="home">
        <div class="home-text">
            <h1>Coffee Shop</h1>
            <p>Coffee Shop is a place where you can enjoy a variety of coffee and tea.</p>
            <a href="#" class="btn">Order Now</a>
        </div>
        <div class="home-img">
            <img src="img/cofee-cup.jpg" alt="">
        </div>
    </section>




    <script src="script.js"></script>
</body>

</html>
